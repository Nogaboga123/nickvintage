<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produkt — N&D VINTAGE</title><link rel="stylesheet" href="styles.css"><style>.pwrap{max-width:1250px;margin:auto;padding:45px 24px 90px}.back{display:inline-block;margin-bottom:28px;color:#111;font-size:11px;font-weight:800}.pdetail{display:grid;grid-template-columns:1.15fr .85fr;gap:55px}.gallery-main{background:#eee;aspect-ratio:4/5;overflow:hidden}.gallery-main img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.thumbs button{border:1px solid #ddd;background:#eee;padding:0;aspect-ratio:1;overflow:hidden;cursor:pointer}.thumbs img{width:100%;height:100%;object-fit:cover}.pcopy h1{font-size:clamp(35px,5vw,68px);line-height:.95;letter-spacing:-.06em}.pprice{font-size:25px;font-weight:900;margin:20px 0}.heart{width:100%;padding:15px;border:1px solid #111;background:#fff;font-weight:900;margin:10px 0;cursor:pointer}.heart.on{color:#d60000;border-color:#d60000}.info{border-top:1px solid #ccc;margin-top:25px;padding-top:20px;font-size:12px;line-height:2}.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;place-items:center;padding:25px}.zoom.open{display:grid}.zoom img{max-width:95vw;max-height:92vh}.zoom button{position:absolute;right:25px;top:20px;background:none;border:0;color:#fff;font-size:40px;cursor:pointer}@media(max-width:750px){.pdetail{grid-template-columns:1fr;gap:25px}}</style></head><body><header class="site-header"><a class="logo" href="/">N&amp;D <span>VINTAGE</span></a><nav class="nav"><a href="/">Shop</a><a href="/favoriten.html">Favoriten</a></nav></header><main class="pwrap"><a class="back" href="/">← ZURÜCK ZUM SHOP</a><div id="product">Produkt wird geladen…</div></main><div class="zoom" id="zoom"><button id="zoomClose">×</button><img id="zoomImg" alt=""></div><script>
let p;let favorites=(()=>{try{const v=JSON.parse(localStorage.getItem("nd-vintage-favorites-v2")||"[]");return Array.isArray(v)?v.map(Number):[]}catch{return []}})();const id=Number(new URLSearchParams(location.search).get("id"));const euro=n=>Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"});const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function imgs(){const a=Array.isArray(p.images)?p.images.filter(Boolean):[];if(p.image&&!a.includes(p.image))a.unshift(p.image);return a.length?a:[""]}function draw(){const im=imgs(),fav=favorites.includes(Number(p.id));document.title=p.name+" — N&D VINTAGE";document.getElementById("product").innerHTML='<div class="pdetail"><div><div class="gallery-main">'+(im[0]?'<img id="mainImg" src="'+esc(im[0])+'" alt="'+esc(p.name)+'">':'<div class="empty">Noch kein Produktbild.</div>')+'</div><div class="thumbs">'+im.map((x,n)=>x?'<button data-img="'+esc(x)+'"><img src="'+esc(x)+'" alt="Bild '+(n+1)+'"></button>':'').join("")+'</div></div><div class="pcopy"><p class="eyebrow">'+esc(p.cat)+' · '+esc(p.tag)+'</p><h1>'+esc(p.name)+'</h1><div class="pprice">'+euro(p.price)+'</div><button id="fav" class="heart '+(fav?"on":"")+'">'+(fav?"♥ FAVORISIERT":"♡ ZU FAVORITEN")+'</button><button class="btn btn-dark full" id="add" '+(p.status==="sold"?"disabled":"")+'>'+(p.status==="sold"?"AUSVERKAUFT":"IN DEN WARENKORB")+'</button><div class="info"><b>GRÖSSE:</b> '+esc(p.size||"—")+'<br><b>ZUSTAND:</b> '+esc(p.condition||"—")+'<br><b>BRUSTWEITE:</b> '+esc(p.chest||"Noch nicht eingetragen")+'<br><b>LÄNGE:</b> '+esc(p.length||"Noch nicht eingetragen")+'<br><b>HINWEIS:</b> Vintage-Einzelstück. Bitte Produktbilder und Maße beachten.</div></div></div>';document.querySelectorAll("[data-img]").forEach(b=>b.onclick=()=>{document.getElementById("mainImg").src=b.dataset.img});const main=document.getElementById("mainImg");if(main)main.onclick=()=>{document.getElementById("zoomImg").src=main.src;document.getElementById("zoom").classList.add("open")};document.getElementById("fav").onclick=()=>{const n=Number(p.id);favorites=favorites.includes(n)?favorites.filter(x=>x!==n):favorites.concat(n);localStorage.setItem("nd-vintage-favorites-v2",JSON.stringify(favorites));draw()};document.getElementById("add").onclick=()=>{let cart=JSON.parse(localStorage.getItem("nd-vintage-cart")||"[]");const x=cart.find(x=>Number(x.id)===Number(p.id));if(x)x.qty++;else cart.push({id:Number(p.id),qty:1});localStorage.setItem("nd-vintage-cart",JSON.stringify(cart));location.href="/#shop"}}
document.getElementById("zoomClose").onclick=()=>document.getElementById("zoom").classList.remove("open");document.getElementById("zoom").onclick=e=>{if(e.target.id==="zoom")e.currentTarget.classList.remove("open")};fetch("/api/products").then(r=>r.json()).then(list=>{p=list.find(x=>Number(x.id)===id);if(!p)throw Error();draw()}).catch(()=>document.getElementById("product").innerHTML='<div class="empty">Produkt nicht gefunden.</div>');
</script></body></html>
