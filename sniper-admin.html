<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sniper Admin · N Vintage</title><style>*{box-sizing:border-box}body{margin:0;background:#090b0d;color:#f3f6f4;font:14px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.panel{background:#121619;border:1px solid #293237;border-radius:12px;padding:20px;margin:16px 0}.muted{color:#9aa5aa;font-size:13px;line-height:1.6}h1{letter-spacing:-.05em}label{display:block;font-size:11px;color:#aab4b8;margin:12px 0 6px}input,textarea{width:100%;padding:12px;background:#090d0f;border:1px solid #354047;color:#fff;border-radius:6px}button{padding:11px 14px;background:#d5ff62;border:0;border-radius:6px;font-weight:800;cursor:pointer;margin:8px 6px 0 0}.secondary{background:#293237;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #303a3f;padding:14px;border-radius:8px;margin:10px 0}.hide{display:none}.status{color:#d5ff62;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><h1>N Vintage · Sniper Admin</h1><p class="muted">Zahlungsanfragen, Bankdaten und lebenslange Mitgliedschaften verwalten.</p><section id="login" class="panel"><h2>Admin-Anmeldung</h2><label>Admin-Passwort</label><input id="pw" type="password" autocomplete="current-password"><button id="loginBtn">Anmelden</button><p id="loginMsg" class="muted"></p></section><div id="dash" class="hide"><section class="panel"><h2>Bankverbindung</h2><p class="muted">Diese Angaben werden Käufern nach ihrer Anfrage angezeigt. Bitte vor dem Start vollständig ausfüllen.</p><div class="grid"><div><label>Kontoinhaber</label><input id="holder"></div><div><label>Bank</label><input id="bank"></div><div><label>IBAN</label><input id="iban" autocomplete="off"></div><div><label>BIC (optional)</label><input id="bic"></div></div><label>Zusätzliche Zahlungsanweisung</label><textarea id="instructions" rows="3" placeholder="Bitte die Referenz exakt als Verwendungszweck angeben."></textarea><button id="saveBank">Bankdaten speichern</button><span id="bankMsg" class="muted"></span></section><section class="panel"><h2>Zahlungsanfragen</h2><div id="payments" class="muted">Lade …</div></section><section class="panel"><h2>Lebenslange Zugänge</h2><div id="members" class="muted">Lade …</div></section><button id="openOwner" class="secondary">Als Inhaber Sniper öffnen (kostenlos)</button> <button class="secondary" id="logout">Abmelden</button></div></main><script>
const $=id=>document.getElementById(id);async function api(url,opt={}){const r=await fetch(url,{cache:"no-store",credentials:"same-origin",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Fehler");return d}
async function load(){const d=await api("/api/sniper/admin/overview");$("holder").value=d.bank.accountHolder||"";$("bank").value=d.bank.bankName||"";$("iban").value=d.bank.iban||"";$("bic").value=d.bank.bic||"";$("instructions").value=d.bank.instructions||"";$("payments").innerHTML=d.payments.length?d.payments.map(p=>'<article class="item"><b>'+esc(p.email)+'</b><p class="muted">25,00 € · Referenz <b>'+esc(p.reference)+'</b> · '+(p.status==="paid"?"Bezahlt":p.status==="rejected"?"Abgelehnt":"Offen")+' · '+new Date(p.createdAt).toLocaleString("de-DE")+'</p>'+(p.status==="pending"?'<button data-act="paid" data-id="'+esc(p.id)+'">Zahlung bestätigen</button><button class="secondary" data-act="rejected" data-id="'+esc(p.id)+'">Ablehnen</button>':"")+'</article>').join(""):'Noch keine Anfragen.';$("members").innerHTML=d.members.length?d.members.map(m=>'<div class="item"><b>'+esc(m.email)+'</b><p class="muted">Lebenslang aktiv · seit '+new Date(m.activatedAt).toLocaleDateString("de-DE")+' · '+esc(m.paymentReference)+'</p><p class="muted">Zugangscode: <b>'+esc(m.accessToken||"—")+'</b> — diesen Code nach Zahlung manuell an den Käufer senden.</p></div>').join(""):'Noch keine freigeschalteten Mitglieder.'}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function login(){try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("pw").value})});$("login").classList.add("hide");$("dash").classList.remove("hide");await load()}catch(e){$("loginMsg").textContent=e.message}}
$("loginBtn").onclick=login;$("pw").onkeydown=e=>{if(e.key==="Enter")login()};$("saveBank").onclick=async()=>{try{await api("/api/sniper/admin/settings",{method:"PUT",body:JSON.stringify({accountHolder:$("holder").value,bankName:$("bank").value,iban:$("iban").value,bic:$("bic").value,instructions:$("instructions").value})});$("bankMsg").textContent="Gespeichert."}catch(e){$("bankMsg").textContent=e.message}};
$("payments").onclick=async e=>{const b=e.target.closest("[data-act]");if(!b)return;if(!confirm(b.dataset.act==="paid"?"Zahlung wirklich bestätigen und lebenslangen Zugang aktivieren?":"Anfrage ablehnen?"))return;try{await api("/api/sniper/admin/payments/"+encodeURIComponent(b.dataset.id),{method:"PUT",body:JSON.stringify({status:b.dataset.act})});await load()}catch(e){alert(e.message)}};
$("openOwner").onclick=async()=>{try{const d=await api("/api/sniper/admin/owner-access",{method:"POST",body:"{}"});location.href=d.url}catch(e){alert(e.message)}};
$("logout").onclick=async()=>{await fetch("/api/admin/logout",{method:"POST",credentials:"same-origin"});location.reload()};
(async()=>{try{await load();$("login").classList.add("hide");$("dash").classList.remove("hide")}catch{}})();
</script></body></html>
