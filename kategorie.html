<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kollektion — N best of vintage</title><link rel="stylesheet" href="styles.css?v=20261004b"><style>.collection{padding:55px 5vw 90px;background:#fff;min-height:80vh}.collection h1{font-size:clamp(55px,9vw,120px);letter-spacing:-.08em;line-height:.85;margin:20px 0 45px}.collection-nav{display:flex;gap:8px;overflow:auto;margin-bottom:35px}.collection-nav a{border:1px solid #ccc;padding:10px 13px;font-size:9px;font-weight:900;white-space:nowrap}.collection-nav a.on{background:#111;color:#fff}.collection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 14px}.collection-card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.collection-card h3{font-size:11px;margin:10px 0 5px}.collection-card p{font-size:10px;color:#666;margin:0}.collection-card b{display:block;font-size:11px;margin-top:7px}@media(max-width:750px){.collection{padding:35px 12px 80px}.collection-grid{grid-template-columns:repeat(2,1fr);gap:22px 8px}}</style><link rel="stylesheet" href="/storefront.css?v=20261004-emptyfilters"></head><body class="nd-store"><header class="site-header"><a class="logo" href="/" aria-label="N best of vintage Startseite">N <span>best of vintage</span></a><nav class="nav" aria-label="Shop-Navigation"><a href="/#shop">Alle Pieces</a><a href="/#categories">Kategorien</a><a href="/drop.html">Drop</a><a href="/suche.html">Suche</a><a href="/favoriten.html">Favoriten</a></nav><a class="shop-back" href="/#shop">← Zurück zum Shop</a></header><main class="collection"><p class="eyebrow">SHOP COLLECTION</p><h1 id="title">COLLECTION</h1><p class="page-description">Alle Pieces dieser Kategorie auf einen Blick. Wähle eine andere Kategorie oder entdecke die gesamte Auswahl.</p><div class="collection-nav" id="nav"></div><div class="category-filters"><label>Marke<select id="categoryBrand"><option value="">Alle Marken</option></select></label><label>Größe<select id="categorySize"><option value="">Alle Größen</option></select></label><label>Preis<select id="categoryPrice"><option value="">Jeder Preis</option><option value="0-70">Bis 70 €</option><option value="70-100">70 bis 100 €</option><option value="100-up">Ab 100 €</option></select></label><button type="button" class="btn btn-light" id="categoryReset">Filter zurücksetzen</button></div><p id="categoryCount" role="status" aria-live="polite"></p><div class="collection-grid" id="grid"></div></main><script>
const map={tracksuits:"Tracksuits",trackpants:"Trackpants",jacken:"Jacken",hoodies:"Hoodies",sweater:"Sweater",jeans:"Jeans",shirts:"Shirts"};
const requested=new URLSearchParams(location.search).get("cat"),key=Object.hasOwn(map,requested)?requested:"tracksuits",cat=map[key];
const euro=n=>Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let categoryProducts=[];
function filterCategory(xs,brand,size,price){return xs.filter(p=>{
 if(brand&&String(p.brand||p.tag||p.code||"")!==brand)return false;
 if(size&&String(p.size||"")!==size)return false;
 const n=Number(p.price);
 if(price==="0-70"&&!(n<=70))return false;
 if(price==="70-100"&&!(n>70&&n<100))return false;
 if(price==="100-up"&&!(n>=100))return false;
 return true;
}).sort((a,b)=>(a.status==="sold")-(b.status==="sold"))}
const brand=document.getElementById("categoryBrand"),size=document.getElementById("categorySize"),price=document.getElementById("categoryPrice"),grid=document.getElementById("grid");
function renderCategory(){
 renderCategoryChips();
 const list=filterCategory(categoryProducts,brand.value,size.value,price.value);
 document.getElementById("categoryCount").textContent=list.length+" Pieces";
 grid.innerHTML=list.map(p=>'<a class="collection-card" href="/produkt.html?id='+encodeURIComponent(p.id)+'"><img loading="lazy" src="'+esc(p.image||((p.images||[])[0])||"")+'" alt="'+esc(p.name)+'"><h3>'+esc(p.name)+'</h3><p>Größe '+esc(p.size||"—")+' · '+esc(p.condition||"")+'</p><b>'+euro(p.price)+(p.status==="sold"?' · Ausverkauft':'')+'</b></a>').join("")||'<div class="empty-state"><h2>'+(categoryProducts.length?'Keine passenden Pieces':'Noch keine Pieces in dieser Kategorie')+'</h2><p>'+(categoryProducts.length?'Versuche eine andere Größe, Marke oder Preisspanne.':'Entdecke die anderen Kategorien oder die gesamte Auswahl.')+'</p>'+(categoryProducts.length?'<button type="button" class="btn btn-light" id="emptyReset">Filter zurücksetzen</button> ':'')+'<a class="btn btn-dark" href="/#shop">Andere Pieces entdecken →</a></div>';
 document.getElementById("emptyReset")?.addEventListener("click",resetCategory);
}
function renderCategoryChips(){let box=document.getElementById("categoryChips");if(!box){box=document.createElement("div");box.id="categoryChips";box.className="active-filter-chips";box.setAttribute("aria-label","Ausgewählte Filter");document.querySelector(".category-filters").after(box)}box.replaceChildren();[[brand,"Marke"],[size,"Größe"],[price,"Preis"]].forEach(([select,label])=>{if(!select.value)return;const text=label+": "+select.options[select.selectedIndex].text;const b=document.createElement("button");b.type="button";b.className="filter-chip";b.textContent=text+" ×";b.setAttribute("aria-label",text+" entfernen");b.onclick=()=>{select.value="";renderCategory()};box.appendChild(b)});box.hidden=!box.childElementCount}
function resetCategory(){brand.value="";size.value="";price.value="";renderCategory()}
document.getElementById("categoryReset").addEventListener("click",resetCategory);
[brand,size,price].forEach(x=>x.addEventListener("change",renderCategory));
document.getElementById("title").textContent=cat.toUpperCase();document.title=cat+" — N best of vintage";
document.getElementById("nav").innerHTML='<a href="/#shop">Alle Pieces</a>'+Object.entries(map).map(([k,v])=>'<a class="'+(k===key?'on':'')+'" '+(k===key?'aria-current="page" ':'')+'href="/kategorie.html?cat='+k+'">'+v+'</a>').join("");
fetch("/api/products").then(r=>{if(!r.ok)throw Error();return r.json()}).then(xs=>{
 categoryProducts=xs.filter(p=>p.cat===cat);
 for(const [select,values] of [[brand,categoryProducts.map(p=>p.brand||p.tag||p.code)],[size,categoryProducts.map(p=>p.size)]]){
  [...new Set(values.filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b,"de")).forEach(value=>{const option=document.createElement("option");option.value=value;option.textContent=value;select.appendChild(option)});
 }renderCategory();
}).catch(()=>{grid.innerHTML='<div class="empty-state"><h2>Pieces konnten nicht geladen werden</h2><p>Bitte versuche es noch einmal.</p><button type="button" class="btn btn-light" onclick="location.reload()">Erneut versuchen</button></div>';document.getElementById("categoryCount").textContent="";});
</script><footer class="store-footer"><a class="logo" href="/">N <span>best of vintage</span></a><nav aria-label="Service"><a href="/retouren.html">Retouren</a><a href="/#faq">Hilfe & Versand</a><a href="/impressum.html">Impressum</a><a href="/datenschutz.html">Datenschutz</a><a href="/agb.html">AGB</a><a href="/widerruf.html">Widerruf</a></nav></footer><script src="/storefront-ui.js?v=20261004-emptyfilters"></script></body></html>
