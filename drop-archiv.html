<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drop Archiv — N&D VINTAGE</title><link rel="stylesheet" href="styles.css?v=20261004b"><style>.archive{padding:60px 5vw 100px;background:#fff;min-height:80vh}.archive h1{font-size:clamp(60px,10vw,135px);line-height:.8;letter-spacing:-.08em;margin:18px 0 50px}.archive-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 14px}.archive-card img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:grayscale(1);opacity:.65}.archive-card h3{font-size:11px;margin:10px 0 4px}.archive-card span{font-size:9px;font-weight:900}@media(max-width:750px){.archive{padding:40px 12px 80px}.archive-grid{grid-template-columns:repeat(2,1fr);gap:22px 8px}}</style><link rel="stylesheet" href="/storefront.css?v=20261004b"></head><body class="nd-store"><header class="site-header"><a class="logo" href="/" aria-label="N&D Vintage Startseite">N&amp;D <span>VINTAGE</span></a><nav class="nav" aria-label="Shop-Navigation"><a href="/#shop">Alle Pieces</a><a href="/#categories">Kategorien</a><a href="/drop.html">Drop</a><a href="/suche.html">Suche</a><a href="/favoriten.html">Favoriten</a></nav><a class="shop-back" href="/#shop">← Zurück zum Shop</a></header><main class="archive"><p class="eyebrow">PAST PIECES</p><h1>DROP<br>ARCHIV.</h1><div class="archive-grid" id="grid"></div></main><script>fetch("/api/products").then(r=>r.json()).then(xs=>{const sold=xs.filter(p=>p.status==="sold").reverse(),box=document.getElementById("grid");box.innerHTML=sold.map(p=>'<a class="archive-card" href="/produkt.html?id='+p.id+'"><img loading="lazy" src="'+(p.image||((p.images||[])[0])||"")+'" alt=""><h3>'+p.name+'</h3><span>SOLD · '+(p.size||"—")+'</span></a>').join("")||'<div class="empty">Das Drop-Archiv füllt sich mit verkauften Pieces.</div>'})</script><footer class="store-footer"><a class="logo" href="/">N&amp;D <span>VINTAGE</span></a><nav aria-label="Service"><a href="/r
