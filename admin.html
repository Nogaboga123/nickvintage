<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>N&D VINTAGE — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#111;font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit;border-radius:0}.wrap{max-width:1200px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d8d7d0;padding-bottom:22px;margin-bottom:28px}.logo{font-size:20px;font-weight:900;letter-spacing:-.06em}.logo span{font-weight:400}.btn{border:1px solid #111;background:#111;color:#fff;padding:11px 15px;cursor:pointer;font-size:11px;font-weight:800}.btn.light{background:#fff;color:#111;border-color:#ccc}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:#fff;padding:38px;border:1px solid #ddd}.ey{font-size:9px;letter-spacing:.18em;font-weight:800;color:#777}.login h1{font-size:42px;letter-spacing:-.07em;margin:10px 0 28px}.field{margin-bottom:14px}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ccc;background:#fff;resize:vertical}.login .btn{width:100%;margin-top:8px}.err{color:#b00020;font-size:11px;margin-top:12px}.dash{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}.stat{background:#fff;border:1px solid #ddd;padding:20px}.stat small{display:block;color:#777;font-size:9px;letter-spacing:.12em}.stat b{font-size:30px;display:block;margin-top:7px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.toolbar h2{font-size:25px;letter-spacing:-.05em}.products{display:grid;gap:10px}.admin-filters{display:flex;gap:8px;margin-bottom:12px}.admin-filters input,.admin-filters select{padding:11px;border:1px solid #ccc;background:#fff}.admin-filters input{flex:1}.hidden-badge{display:inline-block;background:#eee;padding:4px 6px;margin-top:5px;font-size:8px;font-weight:900}.row{background:#fff;border:1px solid #ddd;padding:15px;display:grid;grid-template-columns:70px 1fr 130px 110px 100px auto;gap:15px;align-items:center}.thumb{width:70px;height:85px;background:#ddd;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-weight:800;font-size:12px}.meta{color:#777;font-size:10px;margin-top:5px}.price input,.stock input{width:100%;padding:9px;border:1px solid #ccc}.actions{display:flex;gap:6px;justify-content:flex-end}.actions button{padding:9px 10px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:9px;font-weight:800}.actions .save{background:#111;color:#fff;border-color:#111}.add{background:#111;color:#fff;padding:18px;margin-top:16px;display:none}.add.open{display:block}.edit-panel{display:none;background:#fff;border:2px solid #111;padding:20px;margin:10px 0 20px}.edit-panel.open{display:block}.edit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.edit-head h3{margin:0;font-size:20px}.edit-actions{display:flex;gap:8px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid .field{margin:0}.settings{margin-top:35px;background:#fff;border:1px solid #ddd;padding:22px}.settings h2{font-size:22px;margin:0 0 18px}.toggle{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;margin:15px 0}.toggle input{width:18px;height:18px}.notice{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:13px 16px;font-size:11px;display:none}.notice.show{display:block}@media(max-width:900px){.row{grid-template-columns:60px 1fr 100px 90px}.row .stock,.row .actions{grid-column:2/-1}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.row{grid-template-columns:55px 1fr}.price,.stock,.row .actions{grid-column:1/-1}.toolbar{align-items:flex-start;gap:10px}.toolbar h2{margin:0}.grid{grid-template-columns:1fr}.wrap{padding:20px 14px}}
.orders-panel{margin-top:30px;background:#fff;border:1px solid #ddd;padding:22px}.order-card{border:1px solid #ddd;padding:16px;display:grid;grid-template-columns:1.3fr 1fr 160px;gap:14px;align-items:center}.order-card input,.order-card select{width:100%;padding:9px;border:1px solid #ccc;background:#fff}.orders-list{display:grid;gap:10px;margin-top:16px}.returns-panel{margin-top:35px;background:#fff;border:1px solid #ddd;padding:22px}.returns-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.returns-head h2{margin:0;font-size:22px}.return-list{display:grid;gap:10px;margin-top:16px}.return-card{border:1px solid #ddd;padding:16px;display:grid;grid-template-columns:1fr 1fr 150px;gap:14px;align-items:center}.return-card b{font-size:12px}.return-card small{display:block;color:#777;margin-top:5px;line-height:1.5}.return-card select{width:100%;padding:10px;border:1px solid #ccc;background:#fff}.empty{padding:20px;background:#f5f4ef;color:#777;font-size:12px}@media(max-width:700px){.return-card{grid-template-columns:1fr}.returns-head{align-items:flex-start;flex-direction:column}}</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="ey">N&D VINTAGE · ADMIN</div><h1>SHOP<br>CONTROL.</h1><div class="field"><label>ADMIN-PASSWORT</label><input id="pw" type="password" autocomplete="current-password" placeholder="Passwort"></div><button class="btn" onclick="login()">ANMELDEN</button><div id="loginErr" class="err"></div></div></div>
<div id="dash" class="dash"><div class="wrap">
<div class="top"><div class="logo">N&D <span>VINTAGE</span><div style="font-size:9px;color:#777;letter-spacing:.15em;margin-top:5px">ADMIN</div></div><div><button class="btn light" onclick="location.href='/'">SHOP</button> <button class="btn" onclick="logout()">ABMELDEN</button></div></div>
<div class="stats"><div class="stat"><small>UMSATZ</small><b id="revenue">0 €</b></div><div class="stat"><small>BESTELLUNGEN</small><b id="orderCount">0</b></div><div class="stat"><small>OFFENE RETOUREN</small><b id="returnCount">0</b></div><div class="stat"><small>PRODUKTE</small><b id="count">0</b></div><div class="stat"><small>VERFÜGBAR</small><b id="available">0</b></div><div class="stat"><small>SHOP STATUS</small><b id="status">—</b></div></div>
<div class="orders-panel"><div class="returns-head"><h2>BESTELLUNGEN</h2><input id="orderSearch" placeholder="Bestellnummer / E-Mail suchen" oninput="renderOrders()" style="padding:10px;border:1px solid #ccc;max-width:280px"></div><div id="ordersList" class="orders-list"><div class="empty">Bestellungen werden geladen…</div></div></div>
<div class="toolbar"><h2>PRODUKTE</h2><button class="btn" onclick="toggleAdd()">+ PRODUKT</button></div><div class="admin-filters"><input id="productSearch" placeholder="Produkte suchen…" oninput="render()"><select id="productState" onchange="render()"><option value="">Alle</option><option value="available">Verfügbar</option><option value="sold">SOLD</option><option value="hidden">Versteckt</option></select></div>
<div id="add" class="add"><div class="grid">
<div class="field"><label>NAME</label><input id="aname" placeholder="Nike Tech Fleece..."></div><div class="field"><label>PREIS (€)</label><input id="aprice" type="number" step=".01" value="89.99"></div><div class="field"><label>KATEGORIE</label><input id="acat" value="Vintage"></div>
<div class="field"><label>GRÖSSE</label><input id="asize" value="M"></div><div class="field"><label>BESTAND</label><input id="astock" type="number" value="1"></div><div class="field"><label>MARKE</label><input id="atag" placeholder="Nike, Adidas..."></div>
<div class="field"><label>FARBE</label><input id="acolor" placeholder="Schwarz"></div><div class="field"><label>ZUSTAND</label><select id="acondition"><option>Wie neu</option><option selected>Sehr gut</option><option>Gut</option></select></div><div class="field"><label>MATERIAL</label><input id="amaterial" placeholder="Baumwolle"></div>
<div class="field"><label>BRUSTWEITE (CM)</label><input id="achest" type="number" step=".5"></div><div class="field"><label>LÄNGE (CM)</label><input id="alength" type="number" step=".5"></div><div class="field"><label>BUNDWEITE (CM)</label><input id="awaist" type="number" step=".5"></div>
<div class="field"><label>BILD-URL</label><input id="aimage" placeholder="https://... oder /bild.jpg"></div><div class="field" style="grid-column:span 2"><label>WEITERE BILDER (eine URL pro Zeile)</label><textarea id="aimages" rows="4" placeholder="/front.jpg&#10;/back.jpg&#10;/detail.jpg"></textarea></div>
<div class="field" style="grid-column:1/-1"><label>BESCHREIBUNG / GEBRAUCHSSPUREN</label><textarea id="adescription" rows="4" placeholder="Zustand, Besonderheiten, Gebrauchsspuren..."></textarea></div>
</div><button class="btn" style="margin-top:15px" onclick="addProduct()">PRODUKT ANLEGEN</button></div>
<div id="editPanel" class="edit-panel"><div class="edit-head"><h3>PRODUKT BEARBEITEN</h3><button class="btn light" onclick="closeEdit()">SCHLIESSEN</button></div><div class="grid">
<div class="field"><label>NAME</label><input id="ename"></div><div class="field"><label>PREIS (€)</label><input id="eprice" type="number" step=".01"></div><div class="field"><label>KATEGORIE</label><input id="ecat"></div>
<div class="field"><label>GRÖSSE</label><input id="esize"></div><div class="field"><label>BESTAND</label><input id="estock" type="number" min="0"></div><div class="field"><label>MARKE</label><input id="etag"></div>
<div class="field"><label>FARBE</label><input id="ecolor"></div><div class="field"><label>ZUSTAND</label><select id="econdition"><option>Wie neu</option><option>Sehr gut</option><option>Gut</option></select></div><div class="field"><label>MATERIAL</label><input id="ematerial"></div>
<div class="field"><label>BRUSTWEITE (CM)</label><input id="echest" type="number" step=".5"></div><div class="field"><label>LÄNGE (CM)</label><input id="elength" type="number" step=".5"></div><div class="field"><label>BUNDWEITE (CM)</label><input id="ewaist" type="number" step=".5"></div>
<div class="field"><label>HAUPTBILD</label><input id="eimage"></div><div class="field" style="grid-column:span 2"><label>ALLE BILDER (eine URL pro Zeile)</label><textarea id="eimages" rows="4"></textarea></div>
<div class="field" style="grid-column:1/-1"><label>BESCHREIBUNG / GEBRAUCHSSPUREN</label><textarea id="edescription" rows="4"></textarea></div><label class="toggle" style="grid-column:1/-1"><input type="checkbox" id="ehidden"> PRODUKT IM SHOP VERSTECKEN</label>
</div><div class="edit-actions"><button class="btn" onclick="saveEdit()">ÄNDERUNGEN SPEICHERN</button><button class="btn light" onclick="closeEdit()">ABBRECHEN</button></div></div>
<div id="products" class="products"></div>
<div class="returns-panel"><div class="returns-head"><h2>RETOUREN</h2><button class="btn light" onclick="loadReturns()">AKTUALISIEREN</button></div><div id="returnList" class="return-list"><div class="empty">Retouren werden geladen…</div></div></div>
<div class="settings"><h2>SHOP-EINSTELLUNGEN</h2><label class="toggle"><input type="checkbox" id="siteOpen"> SHOP ÖFFENTLICH GEÖFFNET</label><div class="field" style="max-width:420px"><label>EARLY-ACCESS-PASSWORT ÄNDERN</label><input id="earlyPw" type="password" placeholder="Neues Passwort (optional)"></div><button class="btn" onclick="saveSettings()">EINSTELLUNGEN SPEICHERN</button></div>
</div></div><div id="notice" class="notice"></div>
<script>
let products=[],orders=[],editingId=null;
const $=id=>document.getElementById(id);
function note(t){$('notice').textContent=t;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),2200)}
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401)throw new Error('AUTH');const d=await r.json();if(!r.ok)throw new Error(d.error||'Fehler');return d}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('pw').value})});showDash()}catch(e){$('loginErr').textContent='Falsches Admin-Passwort.'}}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}
async function showDash(){$('login').style.display='none';$('dash').style.display='block';await load();await loadOrders();await loadReturns()}
async function load(){products=await api('/api/products');render();const s=await api('/api/site-settings');$('siteOpen').checked=!!s.siteOpen;$('status').textContent=s.siteOpen?'LIVE':'EARLY ACCESS'}


async function loadOrders(){try{orders=await api('/api/admin/orders');$('orderCount').textContent=orders.length;$('revenue').textContent=orders.filter(x=>x.status!=='Storniert').reduce((s,x)=>s+Number(x.total||0),0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});renderOrders()}catch(e){$('ordersList').innerHTML='<div class="empty">Bestellungen konnten nicht geladen werden.</div>'}}
function renderOrders(){const q=($('orderSearch')?.value||'').toLowerCase();const list=orders.filter(x=>(x.id+' '+x.email).toLowerCase().includes(q));$('ordersList').innerHTML=list.length?list.map(x=>'<div class="order-card"><div><b>'+esc(x.id)+'</b><small>'+esc(x.email)+'<br>'+new Date(x.createdAt).toLocaleString('de-DE')+' · '+Number(x.total||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'})+'<br>'+x.items.map(i=>i.qty+'× '+esc(i.name)+' ('+esc(i.size||'—')+')').join('<br>')+'</small></div><div><input value="'+esc(x.tracking||'')+'" placeholder="Trackingnummer" onchange="updateOrder(\''+x.id+'\',null,this.value)"></div><div><select onchange="updateOrder(\''+x.id+'\',this.value,null)">'+['Bezahlt','Wird verpackt','Versendet','Erledigt','Storniert'].map(s=>'<option '+(x.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div>').join(''):'<div class="empty">Keine Bestellungen gefunden.</div>'}
async function updateOrder(id,status,tracking){try{const body={};if(status)body.status=status;if(tracking!==null)body.tracking=tracking;await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)});note('Bestellung gespeichert ✓');await loadOrders()}catch(e){note(e.message||'Fehler')}}
async function loadReturns(){try{const list=await api('/api/admin/returns');$('returnCount').textContent=list.filter(x=>x.status!=='Erledigt').length;$('returnList').innerHTML=list.length?list.map(x=>'<div class="return-card"><div><b>'+esc(x.id)+' · '+esc(x.order)+'</b><small>'+esc(x.email)+'<br>'+new Date(x.createdAt).toLocaleString('de-DE')+'</small></div><div><b>'+esc(x.reason||'Kein Grund')+'</b><small>'+esc(x.details||'Keine zusätzliche Nachricht')+'</small></div><div><select onchange="setReturnStatus(\''+x.id+'\',this.value)">'+['Neu','In Prüfung','Genehmigt','Erledigt'].map(s=>'<option '+(x.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div>').join(''):'<div class="empty">Noch keine Retouren angemeldet.</div>'}catch(e){$('returnList').innerHTML='<div class="empty">Retouren konnten nicht geladen werden.</div>'}}
async function setReturnStatus(id,status){try{await api('/api/admin/returns/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({status})});note('Retourenstatus gespeichert ✓')}catch(e){note(e.message||'Fehler')}}
function render(){$('count').textContent=products.length;$('available').textContent=products.filter(p=>(p.stock??1)>0&&!p.hidden).length;const q=($('productSearch')?.value||'').toLowerCase(),state=$('productState')?.value||'';const shown=products.filter(p=>{const hay=[p.name,p.cat,p.tag,p.size,p.color].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(state==='hidden')return !!p.hidden;if(state==='sold')return (p.stock??0)<=0||p.status==='sold';if(state==='available')return (p.stock??0)>0&&!p.hidden;return true});$('products').innerHTML=shown.map(p=>`<div class="row" id="p${p.id}"><div class="thumb">${p.image?'<img src="'+p.image+'" alt="">':''}</div><div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.cat)} · Größe ${esc(p.size||'—')}</div>${p.hidden?'<span class="hidden-badge">VERSTECKT</span>':''}</div><div class="price"><label style="font-size:8px;color:#777">PREIS €</label><input id="price${p.id}" type="number" step=".01" value="${Number(p.price).toFixed(2)}"></div><div class="stock"><label style="font-size:8px;color:#777">BESTAND</label><input id="stock${p.id}" type="number" min="0" value="${p.stock??1}"></div><div class="actions"><button class="save" onclick="openEdit(${p.id})">BEARBEITEN</button><button onclick="duplicateProduct(${p.id})">DUPLIZIEREN</button><button onclick="del(${p.id})">LÖSCHEN</button></div></div>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function save(id){const p=products.find(x=>x.id===id);try{await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({price:Number($('price'+id).value),stock:Math.max(0,Number($('stock'+id).value)||0)})});note('Gespeichert ✓');await load()}catch(e){note('Fehler')}}
function openEdit(id){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;editingId=Number(id);$('ename').value=p.name||'';$('eprice').value=Number(p.price||0);$('ecat').value=p.cat||'';$('esize').value=p.size||'';$('estock').value=p.stock??1;$('etag').value=p.tag||'';$('ecolor').value=p.color||p.colour||'';$('econdition').value=p.condition||'Sehr gut';$('ematerial').value=p.material||'';$('echest').value=p.chest||'';$('elength').value=p.length||'';$('ewaist').value=p.waist||'';$('eimage').value=p.image||'';$('eimages').value=(Array.isArray(p.images)&&p.images.length?p.images:(p.image?[p.image]:[])).join('\n');$('edescription').value=p.description||'';$('ehidden').checked=!!p.hidden;$('editPanel').classList.add('open');$('editPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function closeEdit(){editingId=null;$('editPanel').classList.remove('open')}
async function saveEdit(){if(!editingId)return;try{const images=$('eimages').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),image=$('eimage').value.trim();const body={name:$('ename').value.trim(),price:Number($('eprice').value)||0,cat:$('ecat').value.trim(),size:$('esize').value.trim(),stock:Math.max(0,Number($('estock').value)||0),tag:$('etag').value.trim(),color:$('ecolor').value.trim(),condition:$('econdition').value,material:$('ematerial').value.trim(),chest:Number($('echest').value)||null,length:Number($('elength').value)||null,waist:Number($('ewaist').value)||null,image,images:images.length?images:(image?[image]:[]),description:$('edescription').value.trim(),hidden:$('ehidden').checked};await api('/api/admin/products/'+editingId,{method:'PUT',body:JSON.stringify(body)});note('Alle Änderungen gespeichert ✓');closeEdit();await load()}catch(e){note(e.message||'Fehler')}}
async function duplicateProduct(id){try{await api('/api/admin/products/'+id+'/duplicate',{method:'POST'});note('Produkt dupliziert ✓');await load()}catch(e){note(e.message||'Fehler')}}
async function del(id){if(!confirm('Produkt wirklich löschen?'))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});note('Produkt gelöscht');await load()}catch(e){note('Fehler')}}
function toggleAdd(){$('add').classList.toggle('open')}
async function addProduct(){try{const extra=$('aimages').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),image=$('aimage').value.trim();await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:$('aname').value,price:Number($('aprice').value),cat:$('acat').value,size:$('asize').value,stock:Number($('astock').value),tag:$('atag').value,color:$('acolor').value,condition:$('acondition').value,material:$('amaterial').value,chest:Number($('achest').value)||null,length:Number($('alength').value)||null,waist:Number($('awaist').value)||null,description:$('adescription').value,image,images:[image,...extra].filter(Boolean),new:true})});['aname','aimage','aimages','atag','acolor','amaterial','achest','alength','awaist','adescription'].forEach(x=>$(x).value='');note('Produkt mit Details angelegt ✓');await load();toggleAdd()}catch(e){note(e.message||'Fehler')}}
async function saveSettings(){try{await api('/api/site-settings',{method:'PUT',body:JSON.stringify({siteOpen:$('siteOpen').checked,earlyPassword:$('earlyPw').value})});$('earlyPw').value='';note('Einstellungen gespeichert ✓');await load()}catch(e){note(e.message==='AUTH'?'Bitte neu anmelden':e.message||'Fehler')}}
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
