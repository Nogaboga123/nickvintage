<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suche — N&D VINTAGE</title><link rel="stylesheet" href="styles.css?v=20261004b"><style>.search-page{min-height:75vh;padding:60px 5vw 100px}.search-head{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:35px}.search-head h1{font-size:clamp(48px,8vw,100px);line-height:.85;letter-spacing:-.08em;margin:8px 0}.search-form{display:flex;max-width:700px;margin-bottom:45px}.search-form input{flex:1;min-width:0;border:1px solid #bbb;background:#fff;padding:15px;font-size:16px}.search-form button{border:0;background:#111;color:#fff;padding:0 25px;font-weight:800}.back{font-size:10px;font-weight:800;letter-spacing:.1em}@media(max-width:650px){.search-page{padding:40px 20px 70px}.search-head{align-items:start;flex-direction:column}.search-form button{padding:0 16px}}</style><link rel="stylesheet" href="/storefront.css?v=20261004c"></head><body class="nd-store"><header class="site-header"><a class="logo" href="/" aria-label="N&D Vintage Startseite">N&amp;D <span>VINTAGE</span></a><nav class="nav" aria-label="Shop-Navigation"><a href="/#shop">Alle Pieces</a><a href="/#categories">Kategorien</a><a href="/drop.html">Drop</a><a href="/suche.html">Suche</a><a href="/favoriten.html">Favoriten</a></nav><a class="shop-back" href="/#shop">← Zurück zum Shop</a></header><main class="search-page"><div class="search-head"><div><p class="eyebrow">N&D VINTAGE</p><h1>SUCHERGEBNISSE</h1></div><span id="count"></span></div><form class="search-form" id="form"><input id="q" autocomplete="off" placeholder="Nike Tech, blau, Hoodie …"><button>SUCHEN</button></form><div class="products" id="results"></div></main><script>
const euro=n=>Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"});const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const aliases={rot:"red",blau:"blue navy",navy:"navy blau",grau:"grey gray",grey:"grey grau",schwarz:"black",black:"black schwarz",beige:"beige",weiß:"white",weiss:"white",grün:"green",gruen:"green",gelb:"yellow"};let products=[];const input=document.getElementById("q");input.value=new URLSearchParams(location.search).get("q")||"";
function matches(p,q){const terms=q.toLowerCase().trim().split(/\s+/).filter(Boolean);const raw=[p.name,p.cat,p.code,p.tag,p.size,p.condition,p.color,p.colour,p.description].filter(Boolean).join(" ").toLowerCase();const hay=raw+" "+Object.entries(aliases).filter(([a,b])=>raw.includes(a)||b.split(" ").some(x=>raw.includes(x))).flat().join(" ");return terms.every(t=>hay.includes(t)||(aliases[t]||"").split(" ").some(x=>x&&hay.includes(x)))}
function draw(){const q=input.value.trim(),list=q?products.filter(p=>matches(p,q)):[];document.getElementById("count").textContent=list.length+" Pieces";document.getElementById("results").innerHTML=list.length?list.map(p=>'<article class="product" data-id="'+Number(p.id)+'"><div class="product-image '+(p.status==="sold"?"sold":"")+'">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'<div class="fake-photo">'+esc(p.code||"NV")+'</div>')+'<span class="badge">'+(p.status==="sold"?"SOLD":esc(p.new?"NEW":p.tag||"VINTAGE"))+'</span></div><div class="product-info"><h3>'+esc(p.name)+'</h3><p>'+esc(p.cat)+' · '+esc(p.size)+' · '+esc(p.condition)+'</p><p class="price">'+euro(p.price)+'</p></div></article>').join(""):'<div class="empty-state"><h2>'+(q?'Keine passenden Pieces':'Was suchst du?')+'</h2><p>'+(q?'Versuche eine Marke, Kategorie oder eine andere Schreibweise.':'Gib oben eine Marke, Farbe oder ein Piece ein.')+'</p><a class="btn btn-dark" href="/#shop">Andere Pieces entdecken →</a></div>';document.querySelectorAll(".product[data-id]").forEach(x=>x.onclick=()=>location.href="/produkt.html?id="+x.dataset.id)}
document.getElementById("form").onsubmit=e=>{e.preventDefault();const q=input.value.trim();if(!q)return;history.replaceState(null,"","/suche.html?q="+encodeURIComponent(q));draw()};fetch("/api/products").then(r=>r.json()).then(x=>{products=x;draw()}).catch(()=>document.getElementById("results").innerHTML='<div class="empty">Suche konnte nicht geladen werden.</div>');
</script><footer class="store-footer"><a class="logo" href="/">N&amp;D <span>VINTAGE</span></a><nav aria-label="Service"><a href="/retouren.html">Retouren</a><a href="/#faq">Hilfe & Versand</a><a href="/impressum.html">Impressum</a><a href="/datenschutz.html">Datenschutz</a><a href="/agb.html">AGB</a><a href="/widerruf.html">Widerruf</a></nav></footer><script src="/storefront-ui.js?v=20261004c"></script></body></html>
