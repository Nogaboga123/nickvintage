<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NickVintage Admin</title><link rel="stylesheet" href="styles.css"><style>
body{background:#eceae3}.admin{max-width:1200px;margin:auto;padding:35px 20px}.adminbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.admin h1{font-size:48px;letter-spacing:-.07em;margin:0}.panel{background:#f8f7f2;border:1px solid #d2d0c8;padding:25px;margin-bottom:20px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccc;background:white}.span2{grid-column:span 2}.btnx{border:1px solid #111;background:#111;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}.btnx.light{background:transparent;color:#111}.products-admin{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.admin-product{background:white;border:1px solid #ddd;padding:12px}.admin-img{height:220px;background:#aaa;display:grid;place-items:center;overflow:hidden}.admin-img img{width:100%;height:100%;object-fit:cover}.admin-product h3{font-size:13px}.admin-meta{font-size:11px;color:#666;line-height:1.7}.actions{display:flex;gap:8px;margin-top:12px}.login{max-width:420px;margin:15vh auto;background:#f8f7f2;padding:30px;border:1px solid #ccc}.login input{width:100%;padding:14px;margin:8px 0 14px;border:1px solid #ccc}@media(max-width:800px){.formgrid,.products-admin{grid-template-columns:1fr}.span2{grid-column:auto}}
</style></head><body>
<div id="login" class="login"><p class="eyebrow">NICKVINTAGE</p><h1>ADMIN</h1><p>Verwalte deine Produkte, Preise und Bilder.</p><input id="pw" type="password" placeholder="Admin-Passwort"><button class="btnx" onclick="login()">ANMELDEN</button><p id="loginMsg"></p></div>
<div id="app" class="admin" style="display:none">
<div class="adminbar"><div><p class="eyebrow">NICKVINTAGE / ADMIN</p><h1>PRODUKTE</h1></div><button class="btnx light" onclick="logout()">ABMELDEN</button></div>
<div class="panel"><h2>Shop-Steuerung</h2><p style="color:#666;font-size:12px;line-height:1.6">Schalte den öffentlichen Shop frei oder sperre ihn wieder. Beim geschlossenen Shop funktioniert der Early-Access-Code weiterhin.</p><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button type="button" class="btnx" id="siteToggle">STATUS LADEN…</button><input id="earlyPw" type="password" placeholder="Neues Early-Access-Passwort" style="padding:12px;border:1px solid #ccc"><button type="button" class="btnx light" onclick="changeEarlyPw()">PASSWORT ÄNDERN</button></div><p id="siteMsg" style="font-size:11px;color:#666"></p></div>
<div class="panel"><h2 id="formTitle">Neues Produkt</h2><form id="form"><input type="hidden" id="id"><div class="formgrid">
<div class="field span2"><label>PRODUKTNAME</label><input id="name" required placeholder="z. B. Nike Vintage Trackjacket"></div>
<div class="field"><label>PREIS (€)</label><input id="price" type="number" step=".01" min="0" required></div>
<div class="field"><label>KATEGORIE</label><select id="cat"><option>Jacken</option><option>Trackpants</option><option>Tracksuits</option><option>Hoodies</option><option>Sweater</option><option>Jeans</option><option>Shirts</option><option>Sonstiges</option></select></div>
<div class="field"><label>GRÖSSE</label><input id="size" placeholder="M / W32 / One Size"></div>
<div class="field"><label>ZUSTAND</label><input id="condition" value="Sehr gut"></div>
<div class="field"><label>LABEL / TAG</label><input id="tag" value="VINTAGE"></div>
<div class="field"><label>CODE</label><input id="code" value="NV"></div>
<div class="field"><label>BESTAND</label><input id="stock" type="number" min="0" value="1"></div>
<div class="field"><label>BILD HOCHLADEN</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
<div class="field"><label>BILD-URL (optional)</label><input id="image" placeholder="/uploads/meinbild.jpg"></div>
</div><p><label style="font-size:10px;font-weight:800"><input id="isNew" type="checkbox"> ALS NEW MARKIEREN</label></p><button class="btnx" id="saveBtn">PRODUKT SPEICHERN</button> <button type="button" class="btnx light" onclick="resetForm()">ABBRECHEN</button></form></div>
<div class="panel"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><h2>Deine Produkte</h2><input id="search" placeholder="Produkte suchen…" style="padding:11px;border:1px solid #ccc"></div><div id="list" class="products-admin"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let products=[];
async function api(url,opt={}){const r=await fetch(url,{credentials:"include",...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Fehler");return d}
async function login(){try{await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})});$("loginMsg").textContent="";$("login").style.display="none";$("app").style.display="block";load()}catch(e){$("loginMsg").textContent=e.message;$("pw").select()}}
async function logout(){await api("/api/admin/logout",{method:"POST"});location.reload()}
async function load(){try{products=await api("/api/products");render();loadSiteSettings()}catch(e){$("login").style.display="block";$("app").style.display="none"}}
async function loadSiteSettings(){const s=await api("/api/site-settings");const b=$("siteToggle");b.dataset.open=s.siteOpen?"1":"0";b.textContent=s.siteOpen?"SHOP ÖFFENTLICH · SCHLIESSEN":"SHOP GESCHLOSSEN · ÖFFNEN";b.className="btnx"+(s.siteOpen?" light":"");}
$("siteToggle").onclick=async()=>{const b=$("siteToggle");const open=b.dataset.open!=="1";await api("/api/site-settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({siteOpen:open})});$("siteMsg").textContent=open?"Der Shop ist jetzt öffentlich geöffnet.":"Der Shop ist wieder geschlossen.";loadSiteSettings()}
async function changeEarlyPw(){const v=$("earlyPw").value.trim();if(!v)return alert("Bitte ein neues Passwort eingeben.");await api("/api/site-settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({earlyPassword:v})});$("earlyPw").value="";$("siteMsg").textContent="Early-Access-Passwort geändert."}
function render(){const q=($("search").value||"").toLowerCase();$("list").innerHTML=products.filter(p=>(p.name||"").toLowerCase().includes(q)).map(p=>`<div class="admin-product"><div class="admin-img">${p.image?`<img src="${p.image}">`:`<b>${p.code||"NV"}</b>`}</div><h3>${p.name}</h3><div class="admin-meta">${p.cat} · ${p.size||"keine Größe"}<br>${Number(p.price||0).toFixed(2).replace(".",",")} € · Bestand: ${p.stock??1}<br>${p.condition||""}</div><div class="actions"><button class="btnx light" onclick="edit(${p.id})">BEARBEITEN</button><button class="btnx" onclick="del(${p.id})">LÖSCHEN</button></div></div>`).join("")||"<p>Keine Produkte.</p>"}
function edit(id){const p=products.find(x=>x.id===id);$("id").value=p.id;$("name").value=p.name;$("price").value=p.price;$("cat").value=p.cat;$("size").value=p.size||"";$("condition").value=p.condition||"Sehr gut";$("tag").value=p.tag||"VINTAGE";$("code").value=p.code||"NV";$("stock").value=p.stock??1;$("image").value=p.image||"";$("isNew").checked=!!p.new;$("formTitle").textContent="Produkt bearbeiten";scrollTo({top:0,behavior:"smooth"})}
function resetForm(){$("form").reset();$("id").value="";$("price").value="";$("stock").value=1;$("condition").value="Sehr gut";$("tag").value="VINTAGE";$("code").value="NV";$("formTitle").textContent="Neues Produkt"}
async function del(id){if(!confirm("Produkt wirklich löschen?"))return;await api("/api/admin/products/"+id,{method:"DELETE"});load()}
$("form").onsubmit=async e=>{e.preventDefault();try{let image=$("image").value.trim();const f=$("imageFile").files[0];if(f){const fd=new FormData();fd.append("image",f);image=(await api("/api/admin/upload",{method:"POST",body:fd})).url}const body={name:$("name").value,price:Number($("price").value),cat:$("cat").value,size:$("size").value,condition:$("condition").value,tag:$("tag").value,code:$("code").value,stock:Number($("stock").value),image,new:$("isNew").checked};const id=$("id").value;await api(id?"/api/admin/products/"+id:"/api/admin/products",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});resetForm();load();}catch(e){alert(e.message)}};
$("search").oninput=render;$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></body></html>
