<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drop — N&D VINTAGE</title><link rel="stylesheet" href="styles.css"><style>.drop-page{background:#111;color:#fff;padding:70px 5vw}.drop-page h1{font-size:clamp(70px,12vw,170px);line-height:.75;letter-spacing:-.08em;margin:15px 0 35px}.drop-time{font-size:clamp(30px,6vw,75px);font-weight:900}.drop-products{padding:65px 5vw 100px;background:#fff}.drop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 14px}.drop-card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.drop-card h3{font-size:11px;margin:10px 0 5px}.drop-card b{font-size:11px}@media(max-width:750px){.drop-page{padding:55px 20px}.drop-grid{grid-template-columns:repeat(2,1fr);gap:22px 8px}.drop-products{padding:45px 12px 80px}}</style></head><body><header class="site-header"><a class="logo" href="/">N&D <span>VINTAGE</span></a><nav class="nav"><a href="/">Shop</a><a href="/favoriten.html">Favoriten</a></nav></header><section class="drop-page"><p class="eyebrow">NEXT RELEASE</p><h1 id="dropName">DROP</h1><div class="drop-time" id="timer">--:--:--</div></section><section class="drop-products"><p class="eyebrow">DROP PIECES</p><div class="drop-grid" id="grid"></div></section><script>const euro=n=>Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"}),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));Promise.all([fetch("/api/public-settings").then(r=>r.json()),fetch("/api/products").then(r=>r.json())]).then(([s,xs])=>{document.getElementById("dropName").textContent=s.dropName||"NEXT DROP";if(s.dropDate){const target=new Date(s.dropDate),tick=()=>{const d=Math.max(0,target-Date.now()),h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),sec=Math.floor(d%6e4/1000);document.getElementById("timer").textContent=[h,m,sec].map(x=>String(x).padStart(2,"0")).join(":")};tick();setInterval(tick,1000)}const list=[...xs].sort((a,b)=>new Date(b.publishAt||b.createdAt||0)-new Date(a.publishAt||a.createdAt||0)).slice(0,12);document.getElementById("grid").innerHTML=list.map(p=>'<a class="drop-card" href="/produkt.html?id='+p.id+'"><img loading="lazy" src="'+esc(p.image||((p.images||[])[0])||"")+'" alt="'+esc(p.name)+'"><h3>'+esc(p.name)+'</h3><b>'+euro(p.price)+'</b></a>').join("")}).catch(()=>{});</script></body></html>
