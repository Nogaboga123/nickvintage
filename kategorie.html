<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kollektion — N&D VINTAGE</title><link rel="stylesheet" href="styles.css"><style>.collection{padding:55px 5vw 90px;background:#fff;min-height:80vh}.collection h1{font-size:clamp(55px,9vw,120px);letter-spacing:-.08em;line-height:.85;margin:20px 0 45px}.collection-nav{display:flex;gap:8px;overflow:auto;margin-bottom:35px}.collection-nav a{border:1px solid #ccc;padding:10px 13px;font-size:9px;font-weight:900;white-space:nowrap}.collection-nav a.on{background:#111;color:#fff}.collection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 14px}.collection-card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.collection-card h3{font-size:11px;margin:10px 0 5px}.collection-card p{font-size:10px;color:#666;margin:0}.collection-card b{display:block;font-size:11px;margin-top:7px}@media(max-width:750px){.collection{padding:35px 12px 80px}.collection-grid{grid-template-columns:repeat(2,1fr);gap:22px 8px}}</style></head><body><header class="site-header"><a class="logo" href="/">N&D <span>VINTAGE</span></a><nav class="nav"><a href="/">Shop</a><a href="/drop.html">Drop</a><a href="/favoriten.html">Favoriten</a></nav><a class="shop-back" href="/#shop">← Zurück zum Shop</a></header><main class="collection"><p class="eyebrow">SHOP COLLECTION</p><h1 id="title">COLLECTION</h1><div class="collection-nav" id="nav"></div><div class="collection-grid" id="grid"></div></main><script>const map={tracksuits:"Tracksuits",trackpants:"Trackpants",jacken:"Jacken",hoodies:"Hoodies",sweater:"Sweater",jeans:"Jeans",shirts:"Shirts"},key=new URLSearchParams(location.search).get("cat")||"tracksuits",cat=map[key]||"Tracksuits",euro=n=>Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"}),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));document.getElementById("title").textContent=cat.toUpperCase();document.title=cat+" — N&D VINTAGE";document.getElementById("nav").innerHTML=Object.entries(map).map(([k,v])=>'<a class="'+(k===key?'on':'')+'" href="/kategorie.html?cat='+k+'">'+v.toUpperCase()+'</a>').join("");fetch("/api/products").then(r=>r.json()).then(xs=>{const list=xs.filter(p=>p.cat===cat).sort((a,b)=>(a.status==="sold")-(b.status==="sold"));document.getElementById("grid").innerHTML=list.map(p=>'<a class="collection-card" href="/produkt.html?id='+p.id+'"><img loading="lazy" src="'+esc(p.image||((p.images||[])[0])||"")+'" alt="'+esc(p.name)+'"><h3>'+esc(p.name)+'</h3><p>SIZE '+esc(p.size||"—")+' · '+esc(p.condition||"")+'</p><b>'+euro(p.price)+'</b></a>').join("")||'<div class="empty">Noch keine Pieces in dieser Kategorie.</div>'}).catch(()=>{});</script></body></html>
