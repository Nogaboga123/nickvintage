<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favoriten — N best of vintage</title><link rel="stylesheet" href="styles.css?v=20261004b"><style>.favpage{max-width:1200px;margin:auto;padding:60px 24px;min-height:70vh}.favtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.favtop h1{font-size:clamp(42px,8vw,90px);letter-spacing:-.07em;margin:0}.fav-remove{position:absolute;right:12px;top:12px;z-index:4;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#d60000;font-size:21px;cursor:pointer}.product{position:relative}</style><link rel="stylesheet" href="/storefront.css?v=20261004-emptyfilters"></head><body class="nd-store"><header class="site-header"><a class="logo" href="/" aria-label="N best of vintage Startseite">N <span>best of vintage</span></a><nav class="nav" aria-label="Shop-Navigation"><a href="/#shop">Alle Pieces</a><a href="/#categories">Kategorien</a><a href="/drop.html">Drop</a><a href="/suche.html">Suche</a><a href="/favoriten.html">Favoriten</a></nav><a class="shop-back" href="/#shop">← Zurück zum Shop</a></header><main class="favpage"><div class="favtop"><div><p class="eyebrow">SAVED PIECES</p><h1>FAVORITEN.</h1></div><a class="btn btn-light" href="/">← SHOP</a></div><p class="page-description">Deine gespeicherten Pieces – gesammelt an einem Ort.</p><div class="products" id="favProducts"></div></main><script>
let products=[];let favorites=(()=>{try{const v=JSON.parse(localStorage.getItem("nd-vintage-favorites-v2")||"[]");return Array.isArray(v)?v.map(Number):[]}catch{return []}})();
const euro=n=>Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function draw(){const list=products.filter(p=>favorites.includes(Number(p.id)));document.getElementById("favProducts").innerHTML=list.length?list.map(p=>'<article class="product" data-id="'+p.id+'"><button class="fav-remove" data-remove="'+p.id+'">♥</button><div class="product-image">'+(p.image?'<img src="'+esc(p.image)+'" alt="">':'')+'<span class="badge">'+(p.status==="sold"?"SOLD":(p.new?"NEW":esc(p.tag)))+'</span></div><div class="product-info"><h3>'+esc(p.name)+'</h3><p>'+esc(p.cat)+' · '+esc(p.size)+' · '+esc(p.condition)+'</p><p class="price">'+euro(p.price)+'</p></div></article>').join(""):'<div class="empty-state"><span class="empty-symbol" aria-hidden="true">♡</span><h2>Platz für deine Lieblingsstücke</h2><p>Tippe bei einem Piece auf das Herz. Deine Auswahl findest du dann hier wieder.</p><a class="btn btn-dark" href="/#shop">Pieces entdecken</a></div>';document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=e=>{e.stopPropagation();favorites=favorites.filter(x=>x!==Number(b.dataset.remove));localStorage.setItem("nd-vintage-favorites-v2",JSON.stringify(favorites));draw()});document.querySelectorAll(".product").forEach(x=>x.onclick=()=>location.href="/produkt.html?id="+x.dataset.id)}
fetch("/api/products").then(r=>r.json()).then(x=>{products=x;draw()}).catch(()=>document.getElementById("favProducts").innerHTML='<div class="empty">Produkte konnten nicht geladen werden.</div>');
</script><footer class="store-footer"><a class="logo" href="/">N <span>best of vintage</span></a><nav aria-label="Service"><a href="/retouren.html">Retouren</a><a href="/#faq">Hilfe & Versand</a><a href="/impressum.html">Impressum</a><a href="/datenschutz.html">Datenschutz</a><a href="/agb.html">AGB</a><a href="/widerruf.html">Widerruf</a></nav></footer><script src="/storefront-ui.js?v=20261004-emptyfilters"></script></body></html>
