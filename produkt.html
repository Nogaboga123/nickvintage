<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produkt — N&D VINTAGE</title><link rel="stylesheet" href="styles.css"><style>.pwrap{max-width:1250px;margin:auto;padding:45px 24px 90px}.back{display:inline-block;margin-bottom:28px;color:#111;font-size:11px;font-weight:800}.pdetail{display:grid;grid-template-columns:1.15fr .85fr;gap:55px}.gallery-main{background:#eee;aspect-ratio:4/5;overflow:hidden;position:relative;touch-action:pan-y;user-select:none}.gallery-main:after{content:"SWIPE";position:absolute;right:12px;bottom:12px;background:#111;color:#fff;padding:6px 9px;font-size:8px;font-weight:900;letter-spacing:.12em;pointer-events:none}.gallery-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.gallery-nav button{pointer-events:auto;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:24px;cursor:pointer;margin:10px}.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}.dots i{width:6px;height:6px;border-radius:50%;background:#bbb}.dots i.on{background:#111}.gallery-main img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.thumbs button{border:1px solid #ddd;background:#eee;padding:0;aspect-ratio:1;overflow:hidden;cursor:pointer}.thumbs img{width:100%;height:100%;object-fit:cover}.pcopy h1{font-size:clamp(35px,5vw,68px);line-height:.95;letter-spacing:-.06em}.pprice{font-size:25px;font-weight:900;margin:20px 0}.heart{width:100%;padding:15px;border:1px solid #111;background:#fff;font-weight:900;margin:10px 0;cursor:pointer}.heart.on{color:#d60000;border-color:#d60000}.info{border-top:1px solid #ccc;margin-top:25px;padding-top:20px;font-size:12px;line-height:2}.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;place-items:center;padding:25px}.zoom.open{display:grid}.zoom img{max-width:95vw;max-height:92vh}.zoom button{position:absolute;right:25px;top:20px;background:none;border:0;color:#fff;font-size:40px;cursor:pointer} .product-assurance{display:grid;gap:7px;margin:18px 0;font-size:10px;font-weight:800}.product-assurance span{border:1px solid #ddd;padding:10px}.pfaq{border-top:1px solid #ccc;padding:15px 0;font-size:11px}.pfaq summary{cursor:pointer;font-weight:900;display:flex;justify-content:space-between}.pfaq p{line-height:1.7;color:#555}@media(max-width:750px){.pdetail{grid-template-columns:1fr;gap:25px}.pwrap{padding-bottom:100px}.sticky-buy{display:block!important;position:fixed;left:10px;right:10px;bottom:10px;z-index:150;background:#111;color:#fff;border:0;padding:17px;font-weight:900}.sticky-buy:disabled{opacity:.5}}.sticky-buy{display:none}</style></head><body><header class="site-header"><a class="logo" href="/">N&amp;D <span>VINTAGE</span></a><nav class="nav"><a href="/">Shop</a><a href="/favoriten.html">Favoriten</a></nav></header><main class="pwrap"><a class="back" href="/">← ZURÜCK ZUM SHOP</a><div id="product">Produkt wird geladen…</div></main><button type="button" id="stickyBuy" class="sticky-buy">IN DEN WARENKORB</button><div class="zoom" id="zoom"><button id="zoomClose">×</button><img id="zoomImg" alt=""></div><script>
let p;let favorites=(()=>{try{const v=JSON.parse(localStorage.getItem("nd-vintage-favorites-v2")||"[]");return Array.isArray(v)?v.map(Number):[]}catch{return []}})();const id=Number(new URLSearchParams(location.search).get("id"));const euro=n=>Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"});const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let currentImage=0;function imgs(){const a=Array.isArray(p.images)?p.images.filter(Boolean):[];if(p.image&&!a.includes(p.image))a.unshift(p.image);return a.length?a:[""]}function draw(){const im=imgs(),fav=favorites.includes(Number(p.id));document.title=p.name+" — N&D VINTAGE";document.getElementById("product").innerHTML='<div class="pdetail"><div><div class="gallery-main" id="gallery">'+(im[currentImage]?'<img id="mainImg" src="'+esc(im[currentImage])+'" alt="'+esc(p.name)+'">':'<div class="empty">Noch kein Produktbild.</div>')+'<div class="gallery-nav"><button type="button" id="prevImg">‹</button><button type="button" id="nextImg">›</button></div></div><div class="dots">'+im.map((_,n)=>'<i class="'+(n===currentImage?'on':'')+'"></i>').join("")+'</div><div class="thumbs">'+im.map((x,n)=>x?'<button data-img="'+esc(x)+'"><img src="'+esc(x)+'" alt="Bild '+(n+1)+'"></button>':'').join("")+'</div></div><div class="pcopy"><p class="eyebrow">'+esc(p.cat)+' · '+esc(p.tag)+'</p><h1>'+esc(p.name)+'</h1><div class="pprice">'+euro(p.price)+'</div><div class="product-assurance"><span>1 OF 1 · NUR 1 VERFÜGBAR</span><span>✓ Geprüftes Vintage Piece</span><span>📦 Versand mit Tracking</span><span>♡ Einzelstück</span></div><button id="fav" class="heart '+(fav?"on":"")+'">'+(fav?"♥ FAVORISIERT":"♡ ZU FAVORITEN")+'</button><button class="btn btn-dark full" id="add" '+(p.status==="sold"?"disabled":"")+'>'+(p.status==="sold"?"AUSVERKAUFT":"IN DEN WARENKORB")+'</button><div class="info"><b>GRÖSSE:</b> '+esc(p.size||"—")+'<br><b>ZUSTAND:</b> '+esc(p.condition||"—")+'<br><b>BRUSTWEITE:</b> '+esc(p.chest||"Noch nicht eingetragen")+'<br><b>LÄNGE:</b> '+esc(p.length||"Noch nicht eingetragen")+'<br><b>HINWEIS:</b> Vintage-Einzelstück. Bitte Produktbilder und Maße beachten.</div><details class="pfaq"><summary>GRÖSSENHILFE <span>+</span></summary><p>Brustweite: flach von Achsel zu Achsel messen. Länge: von der höchsten Schulterstelle bis zum Saum. Bundweite: Bund flach von links nach rechts messen.</p></details><button type="button" id="share" class="heart">↗ PRODUKT TEILEN</button><div id="similar"></div><details class="pfaq"><summary>VERSAND & VERPACKUNG <span>+</span></summary><p>Sicher verpackter Versand. Tracking wird nach dem Versand über den Bestellstatus angezeigt.</p></details><details class="pfaq"><summary>ZUSTAND & VINTAGE <span>+</span></summary><p>Vintage-Artikel können altersbedingte Gebrauchsspuren haben. Maßgeblich sind die Produktbilder, Maße und Zustandsangaben.</p></details></div></div>';const showImage=n=>{currentImage=(n+im.length)%im.length;const m=document.getElementById("mainImg");if(m)m.src=im[currentImage];document.querySelectorAll(".dots i").forEach((d,j)=>d.classList.toggle("on",j===currentImage))};document.querySelectorAll("[data-img]").forEach((b,n)=>b.onclick=()=>showImage(n));document.getElementById("prevImg").onclick=e=>{e.stopPropagation();showImage(currentImage-1)};document.getElementById("nextImg").onclick=e=>{e.stopPropagation();showImage(currentImage+1)};const gallery=document.getElementById("gallery");let sx=0;gallery.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});gallery.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)showImage(currentImage+(dx<0?1:-1))},{passive:true});const main=document.getElementById("mainImg");if(main)main.onclick=()=>{document.getElementById("zoomImg").src=main.src;document.getElementById("zoom").classList.add("open")};document.getElementById("fav").onclick=()=>{const n=Number(p.id);favorites=favorites.includes(n)?favorites.filter(x=>x!==n):favorites.concat(n);localStorage.setItem("nd-vintage-favorites-v2",JSON.stringify(favorites));draw()};const sticky=document.getElementById("stickyBuy");sticky.textContent=p.status==="sold"?"AUSVERKAUFT":"IN DEN WARENKORB · "+euro(p.price);sticky.disabled=p.status==="sold";sticky.onclick=()=>document.getElementById("add")?.click();document.getElementById("share").onclick=async()=>{const data={title:p.name,text:p.name,url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);document.getElementById("share").textContent="✓ LINK KOPIERT"}}catch{}};document.getElementById("add").onclick=()=>{let cart=JSON.parse(localStorage.getItem("nd-vintage-cart")||"[]");const x=cart.find(x=>Number(x.id)===Number(p.id));if(x)x.qty++;else cart.push({id:Number(p.id),qty:1});localStorage.setItem("nd-vintage-cart",JSON.stringify(cart));location.href="/#shop"}}
document.getElementById("zoomClose").onclick=()=>document.getElementById("zoom").classList.remove("open");document.getElementById("zoom").onclick=e=>{if(e.target.id==="zoom")e.currentTarget.classList.remove("open")};fetch("/api/products").then(r=>r.json()).then(list=>{p=list.find(x=>Number(x.id)===id);if(!p)throw Error();let seen=[];try{seen=JSON.parse(localStorage.getItem("nd-vintage-recent")||"[]").map(Number)}catch{}fetch("/api/analytics",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({productId:Number(p.id),type:"view"})}).catch(()=>{});seen=seen.filter(x=>x!==Number(p.id));localStorage.setItem("nd-vintage-recent",JSON.stringify([Number(p.id),...seen].slice(0,8)));draw();const score=x=>(x.cat===p.cat?5:0)+(x.tag===p.tag?3:0)+(x.size===p.size?2:0)+(Math.abs(Number(x.price)-Number(p.price))<=25?1:0);const similar=list.filter(x=>Number(x.id)!==Number(p.id)&&x.status!=="sold").sort((a,b)=>score(b)-score(a)).filter(x=>score(x)>0).slice(0,4);const box=document.getElementById("similar");if(box&&similar.length)box.innerHTML='<div style="margin-top:28px;border-top:1px solid #ccc;padding-top:20px"><b style="font-size:11px">ÄHNLICHE PIECES</b><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px">'+similar.map(x=>'<a href="/produkt.html?id='+x.id+'" style="color:#111;text-decoration:none;font-size:10px"><img src="'+esc(x.image||'')+'" style="width:100%;aspect-ratio:1;object-fit:cover;background:#eee"><b style="display:block;margin-top:5px">'+esc(x.name)+'</b></a>').join('')+'</div></div>'}).catch(()=>document.getElementById("product").innerHTML='<div class="empty">Produkt nicht gefunden.</div>');
</script></body></html>
